# MySQL 8.4 disposable test service — QN AI 内容工作台
#
# 用途：为 DuplicateReview（D11）补做真实 MySQL 8.4 的 Release Gate 验证。
# 这是一个**一次性、可丢弃**的测试实例，与任何开发库或生产库无关。
#
# 隔离保证：
#   - 固定随机 host 端口 3399，不与本机 3306/3307 的既有实例冲突
#   - 独立库名 qn_workbench_test、独立账号 qn_test
#   - 密码为公开的本地测试常量，仅用于 throwaway 容器，绝非任何真实凭据
#   - 容器名显式带 disposable 前缀，`--rm` 退出即销毁
#
# 用法：
#   docker compose -f docker-compose.mysql-test.yml up -d
#   # 等待 healthy 后按 docs/MYSQL84_TESTING.md 执行验证
#   docker compose -f docker-compose.mysql-test.yml down -v
#
# 注意：本文件不含任何真实密码。真实测试用 .env 另存为 .env.mysql-testing，
# 该文件已被 .gitignore 忽略，绝不提交。

services:
  mysql-test:
    image: mysql:8.4
    container_name: qn-workbench-mysql84-disposable
    command:
      # 明确指定 InnoDB 与 utf8mb4，避免依赖镜像默认值。
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-storage-engine=InnoDB
      # 行锁是本次验证的核心对象，保持默认 REPEATABLE READ 并打印出来便于核对。
      - --transaction-isolation=REPEATABLE-READ
      # 让 lockForUpdate 的等待行为可观测，避免静默死锁直接失败。
      - --innodb-lock-wait-timeout=10
    environment:
      MYSQL_ROOT_PASSWORD: qn_test_root_pw
      MYSQL_DATABASE: qn_workbench_test
      MYSQL_USER: qn_test
      MYSQL_PASSWORD: qn_test_pw
    ports:
      # 宿主机侧随机端口，避免与本机既有 MySQL 冲突。
      - "127.0.0.1:3399:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uqn_test", "-pqn_test_pw"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    tmpfs:
      # 数据 wholly 落在内存里，容器销毁即无残留，不可能污染磁盘上的任何库。
      - /var/lib/mysql
