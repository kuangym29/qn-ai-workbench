name: V2 Foundation CI

on:
  push:
    branches:
      - codex/v2-foundation
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - codex/v2-foundation
      - main

jobs:
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated application env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run V2 foundation schema tests
        run: php artisan test tests/Feature/V2ContentCoreSchemaTest.php

      - name: Run full PHP suite
        run: php artisan test

  mysql84-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated MySQL test env
        run: |
          cp .env.mysql-testing.example .env.mysql-testing
          php artisan key:generate --env=mysql-testing

      - name: Run MySQL 8.4 release gate
        run: bash scripts/test-mysql.sh all

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run official frontend suite
        run: npm run test:frontend

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
